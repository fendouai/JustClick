<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JustClick MCP 验证</title>
<style>
body{font:14px system-ui;margin:0;padding:22px;color:var(--color-text-primary,#222);background:var(--color-background-primary,#fff)}
h1{font-size:19px;margin:0 0 10px}p{line-height:1.6}button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid #aaa;margin:5px 6px 5px 0;background:#f5f5f5;color:#222;cursor:pointer}button:disabled{opacity:.4;cursor:default}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;color:#222;padding:12px;border-radius:8px;font-size:11px}#status{min-height:40px}small{color:#666}
</style></head><body>
<h1>JustClick · 当前聊天按钮验证</h1>
<p>先读取真实宿主能力，再发送唯一测试标记。不会模拟键盘或使用剪贴板。</p>
<button id="probe" disabled>发送验证消息</button><button id="progress" disabled>汇报当前任务进度</button>
<p id="status" role="status">正在等待 MCP 宿主握手…</p>
<small>收到协议响应后，仍需确认测试消息和 ACK 出现在打开面板的同一聊天。</small>
<pre id="details">未收到宿主能力</pre>
<script>
const pending = new Map(); let sequence = 0; let host;
const status = document.getElementById('status');
const details = document.getElementById('details');
const probe = document.getElementById('probe'); const progress = document.getElementById('progress');
function rpc(method, params) {
  const id = ++sequence;
  return new Promise((resolve,reject) => {
    const timeout = setTimeout(() => {pending.delete(id);reject(new Error(method+' 超时'));},12000);
    pending.set(id,{resolve,reject,timeout});
    window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
  });
}
window.addEventListener('message', event => {
  if(event.source!==window.parent || event.data?.jsonrpc!=='2.0')return;
  const message=event.data;
  if(message.method==='ping' && message.id!==undefined){window.parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');return;}
  const request=pending.get(message.id);
  if(!request)return;
  clearTimeout(request.timeout);pending.delete(message.id);
  if(message.error)request.reject(new Error(message.error.message||JSON.stringify(message.error)));
  else request.resolve(message.result);
});
async function record(report) {
  try { const result=await rpc('tools/call',{name:'record_justclick_probe',arguments:{report:JSON.stringify(report)}});
    if(result?.isError)throw new Error('报告保存失败');
  } catch(error) { details.textContent+='\n报告保存失败：'+error.message; }
}
async function send(text, messageId) {
  probe.disabled=progress.disabled=true;status.textContent='正在请求宿主向当前聊天发送…';
  const params={role:'user',content:[{type:'text',text}]};
  if(host.hostCapabilities?.experimental?.['openai/message'])params._meta={'openai/message':{target:'active',send:true}};
  try {
    const response=await rpc('ui/message',params);
    if(response?.isError)throw new Error('宿主返回 isError');
    status.textContent='宿主已返回消息请求响应。请确认同一聊天实际收到消息并生成对应回复。';
    details.textContent=JSON.stringify({hostInfo:host.hostInfo,messageId,response},null,2);
    await record({phase:'message-response',hostInfo:host.hostInfo,hostCapabilities:host.hostCapabilities,messageId,response});
  }catch(error){status.textContent='发送失败：'+error.message;await record({phase:'message-error',messageId,error:error.message});}
  finally{probe.disabled=progress.disabled=false;}
}
probe.onclick=()=>{const id='JC_MCP_'+crypto.randomUUID();return send('这是 JustClick MCP 当前聊天按钮测试。请仅回复 ACK '+id+'，不要执行其他操作。',id);};
progress.onclick=()=>send('请简要说明当前 JustClick MCP 验证已完成什么、还有什么、当前阻碍是什么。','progress');
(async()=>{
  try{
    host=await rpc('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'JustClick MCP probe',version:'0.1.0'},appCapabilities:{availableDisplayModes:['inline']}});
    window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');
    details.textContent=JSON.stringify({hostInfo:host.hostInfo,hostCapabilities:host.hostCapabilities},null,2);
    const available=!!host.hostCapabilities?.message?.text;
    probe.disabled=progress.disabled=!available;
    status.textContent=available?'宿主声明支持文本消息。请点击发送验证消息。':'握手成功，但宿主未声明文本消息能力，按钮已禁用。';
    await record({phase:'initialized',hostInfo:host.hostInfo,hostCapabilities:host.hostCapabilities});
  }catch(error){status.textContent='未完成宿主握手：'+error.message;}
})();
</script></body></html>
